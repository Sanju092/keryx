                    ['Mistral', 'https://api.mistral.ai/v1']
                  ].map(([lbl, u]) => `<button type="button" data-custom-url-preset="${u}" class="pill pill-muted text-[10px] cursor-pointer">${lbl}</button>`).join('')}
                </div>` : ''}
                <div class="flex flex-wrap gap-1">
                  ${allModels.map(mid => {
                    const isCustom = customList.includes(mid);
                    return `<span class="pill ${isCustom ? 'pill-accent' : 'pill-muted'} font-mono-code text-[10px]">
                      <span>${escapeHtml(mid)}</span>
                      ${isCustom ? `<button type="button" data-del-model-provider="${key}" data-del-model-id="${escapeHtml(mid)}" class="ml-1 font-bold" title="Remove custom model ID">×</button>` : ''}
                    </span>`;
                  }).join('')}
                </div>
                <div class="flex gap-1.5">
                  <input data-new-model-input="${key}" class="input-field font-mono-code text-[11px] py-1.5" placeholder="Add exact model ID..." />
                  <button type="button" data-add-model-btn="${key}" class="btn-ghost px-2.5 py-1 text-[11px] shrink-0">+ Add ID</button>
                </div>
              </div>`;
            }).join('')}
            <button id="btn-save-keys" class="btn-primary w-full py-2 text-xs">Save Provider Keys &amp; Endpoints</button>
          </div>

          <!-- Security: Encrypted Key Vault (WebCrypto AES-GCM) -->
          <div class="space-y-2 pt-3 border-t" style="border-color:var(--border);">
            <div class="flex items-center justify-between">
              <div class="text-xs font-bold uppercase tracking-wider" style="color:var(--muted);">Security &amp; Encrypted Vault</div>
              <span class="pill ${state.vault?.encrypted ? (state.vault.locked ? 'pill-warn' : 'pill-success') : 'pill-muted'} text-[10px]">
                ${state.vault?.encrypted ? (state.vault.locked ? 'Locked (AES-GCM)' : 'Unlocked (Encrypted)') : 'Unencrypted'}
              </span>
            </div>
            <div class="flex gap-1.5">
              <input id="vault-passphrase" type="password" class="input-field text-xs flex-1" placeholder="${state.vault?.locked ? 'Enter passphrase to unlock keys...' : 'Passphrase to encrypt API keys at rest...'}" />
              ${state.vault?.locked
                ? `<button type="button" id="btn-vault-unlock" class="btn-primary px-3 text-xs shrink-0">Unlock</button>`
                : `<button type="button" id="btn-vault-lock" class="btn-ghost px-3 text-xs shrink-0">${state.vault?.encrypted ? 'Lock Now' : 'Encrypt & Lock'}</button>`}
            </div>
            ${state.vault?.encrypted && !state.vault?.locked ? `<button type="button" id="btn-vault-clear-enc" class="text-[11px] underline" style="color:var(--muted);">Remove passphrase encryption</button>` : ''}
          </div>

          <!-- Export / Import / Reset -->
          <div class="space-y-2 pt-3 border-t" style="border-color:var(--border);">
            <div class="text-xs font-bold uppercase tracking-wider" style="color:var(--muted);">Backup &amp; Workspace</div>
            <div class="grid grid-cols-2 gap-2">
              <button id="btn-export-bundle" class="btn-ghost py-2 text-xs">Copy JSON Backup</button>
              <button id="btn-download-bundle" class="btn-ghost py-2 text-xs">Download .json</button>
            </div>
            <div class="flex items-center gap-2">
              <label class="btn-ghost flex-1 py-2 text-xs text-center cursor-pointer">
                <span>Import JSON Backup</span>
                <input id="input-import-bundle" type="file" accept=".json,application/json" class="hidden" />
              </label>
              <button id="btn-reset-demo" class="btn-ghost py-2 px-3 text-xs" style="color:var(--danger);">Reset Demo</button>
            </div>
          </div>
        `;

        openSheet('Interface & Provider Vault', 'Customize theme, density, layout & BYOK model keys', html);

        if (focusProvider) {
          requestAnimationFrame(() => {
            const card = document.querySelector(`[data-provider-card="${focusProvider}"]`);
            const keyInp = document.querySelector(`[data-provider-key="${focusProvider}"]`);
            const urlInp = document.querySelector(`[data-provider-url="${focusProvider}"]`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (focusProvider === 'custom' && keyInp && keyInp.value.trim() && urlInp) urlInp.focus();
            else if (keyInp) keyInp.focus();
          });
        }

        document.querySelectorAll('[data-custom-url-preset]').forEach(btn => {
          btn.addEventListener('click', () => {
            const urlInp = document.querySelector('[data-provider-url="custom"]');
            if (urlInp) {
              urlInp.value = btn.dataset.customUrlPreset;
              urlInp.focus();
            }
          });
        });

        document.querySelectorAll('[data-set-preset]').forEach(b => b.addEventListener('click', () => {
          state.ui.preset = b.dataset.setPreset; saveState(); applyTheme(); openSettingsSheet();
        }));
        document.querySelectorAll('[data-set-mode]').forEach(b => b.addEventListener('click', () => {
          state.ui.mode = b.dataset.setMode; saveState(); applyTheme(); openSettingsSheet();
        }));
        document.querySelectorAll('[data-set-density]').forEach(b => b.addEventListener('click', () => {
          state.ui.density = b.dataset.setDensity; saveState(); applyTheme(); openSettingsSheet();
        }));
        document.querySelectorAll('[data-set-accent]').forEach(b => b.addEventListener('click', () => {
          state.ui.accent = b.dataset.setAccent; saveState(); applyTheme(); openSettingsSheet();
        }));
        document.getElementById('toggle-frame-mode').addEventListener('click', () => {
          state.ui.frame = state.ui.frame === 'phone' ? 'responsive' : 'phone';
          saveState(); applyTheme(); openSettingsSheet();
        });
        document.getElementById('btn-save-keys').addEventListener('click', () => {
          document.querySelectorAll('[data-provider-key]').forEach(inp => {
            const k = inp.dataset.providerKey;
            if (!state.providers[k]) state.providers[k] = {};
            state.providers[k].apiKey = inp.value.trim();
          });
          document.querySelectorAll('[data-provider-url]').forEach(inp => {
            const k = inp.dataset.providerUrl;
            if (!state.providers[k]) state.providers[k] = {};
            state.providers[k].baseUrl = inp.value.trim();
          });
          // Auto-populate NVIDIA NIM endpoint if user pasted an nvapi- key without setting a Base URL
          let autoMsg = '';
          if (state.providers.custom) {
            const ck = (state.providers.custom.apiKey || '').trim();
            const cb = (state.providers.custom.baseUrl || '').trim();
            if (ck.startsWith('nvapi-') && (!cb || cb === 'https://api.example.com/v1')) {
              state.providers.custom.baseUrl = 'https://integrate.api.nvidia.com/v1';
              const urlInp = document.querySelector('[data-provider-url="custom"]');
              if (urlInp) urlInp.value = state.providers.custom.baseUrl;
              autoMsg = ' · NVIDIA NIM URL set';
            }
          }
          saveState(); applyTheme(); renderMain();
          showToast('Provider keys & endpoints saved' + autoMsg, 'success');
        });
        document.querySelectorAll('[data-add-model-btn]').forEach(btn => {
          btn.addEventListener('click', () => {
            const k = btn.dataset.addModelBtn;
            const inp = document.querySelector(`[data-new-model-input="${k}"]`);
            if (!inp || !inp.value.trim()) return;
            const added = addCustomModelId(k, inp.value.trim());
            openSettingsSheet();
            showToast(added ? `Added model ID ${inp.value.trim()}` : 'Model ID already exists', added ? 'success' : 'warn');
          });
        });
        document.querySelectorAll('[data-del-model-id]').forEach(btn => {
          btn.addEventListener('click', () => {
            const k = btn.dataset.delModelProvider;
            const id = btn.dataset.delModelId;
            if (state.providers[k] && Array.isArray(state.providers[k].customModels)) {
              state.providers[k].customModels = state.providers[k].customModels.filter(m => m !== id);
              saveState();
              openSettingsSheet();
            }
          });
        });
        document.querySelectorAll('[data-toggle-secret]').forEach(btn => {
          btn.addEventListener('click', () => {
            const inp = document.querySelector(`[data-provider-key="${btn.dataset.toggleSecret}"]`);
            if (!inp) return;
            const show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            btn.textContent = show ? 'Hide' : 'Show';
          });
        });

        const btnLock = document.getElementById('btn-vault-lock');
        if (btnLock) {
          btnLock.addEventListener('click', async () => {
            const pass = document.getElementById('vault-passphrase').value;
            if (!pass || pass.length < 4) { showToast('Enter a passphrase (4+ chars)', 'warn'); return; }
            try {
              const secrets = {
                providers: Object.fromEntries(Object.entries(state.providers).map(([k, v]) => [k, v.apiKey || ''])),
                searchKey: state.search?.apiKey || '',
                connectors: (state.connectors || []).map(c => ({ id: c.id, botToken: c.botToken || '', webhookUrl: c.webhookUrl || '' }))
              };
              const enc = await window.KeryxStorage.encryptVaultSecrets(secrets, pass);
              Object.values(state.providers).forEach(v => { v.apiKey = ''; });
              if (state.search) state.search.apiKey = '';
              (state.connectors || []).forEach(c => { c.botToken = ''; c.webhookUrl = ''; });
              state.vault = { encrypted: true, locked: true, encryptedPayload: enc };
              saveState(); applyTheme(); renderMain(); openSettingsSheet();
              showToast('Vault encrypted & locked (AES-GCM)', 'success');
            } catch (e) {
              showToast('Encryption failed: ' + e.message, 'danger');
            }
          });
        }

        const btnUnlock = document.getElementById('btn-vault-unlock');
        if (btnUnlock) {
          btnUnlock.addEventListener('click', async () => {
            const pass = document.getElementById('vault-passphrase').value;
            if (!pass) { showToast('Enter your passphrase', 'warn'); return; }
            try {
              const secrets = await window.KeryxStorage.decryptVaultSecrets(state.vault.encryptedPayload, pass);
              Object.entries(secrets.providers || {}).forEach(([k, val]) => {
                if (state.providers[k]) state.providers[k].apiKey = val;
              });
              if (state.search && secrets.searchKey) state.search.apiKey = secrets.searchKey;
              (secrets.connectors || []).forEach(sc => {
                const c = (state.connectors || []).find(x => x.id === sc.id);
                if (c) { c.botToken = sc.botToken || ''; c.webhookUrl = sc.webhookUrl || ''; }
              });
              state.vault.locked = false;
              saveState(); applyTheme(); renderMain(); openSettingsSheet();
              showToast('Vault unlocked', 'success');
            } catch (e) {
              showToast('Wrong passphrase or corrupted vault', 'danger');
            }
          });
        }

        const btnClearEnc = document.getElementById('btn-vault-clear-enc');
        if (btnClearEnc) {
          btnClearEnc.addEventListener('click', () => {
            state.vault = { encrypted: false, locked: false, encryptedPayload: null };
            saveState(); applyTheme(); openSettingsSheet();
            showToast('Vault encryption removed');
          });
        }

        document.getElementById('btn-export-bundle').addEventListener('click', () => {
          copyText(window.KeryxStorage.exportBackupJson(state, false), 'Config & Wiki JSON');
        });
        document.getElementById('btn-download-bundle').addEventListener('click', () => {
          downloadMarkdownFile('keryx-backup.json', window.KeryxStorage.exportBackupJson(state, false));
        });
        document.getElementById('input-import-bundle').addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          try {
            const txt = await file.text();
            const imported = window.KeryxStorage.parseBackupJson(txt);
            state = ensureStateDefaults(imported);
            saveState(); applyTheme(); closeSheet(); renderMain(); updateBadges();
            showToast('Backup restored successfully', 'success');
          } catch (err) {
            showToast('Import failed: ' + err.message, 'danger');
          }
        });
        document.getElementById('btn-reset-demo').addEventListener('click', () => {
          openSheet('Confirm Workspace Reset', 'This will erase all saved API keys, custom agents, chats & wiki notes', `
            <div class="space-y-3">
              <p class="text-xs" style="color:var(--muted);">Are you sure you want to reset Keryx back to default demo state?</p>
              <div class="flex gap-2">
                <button type="button" id="btn-confirm-reset-cancel" class="btn-ghost flex-1 py-2 text-xs">Cancel</button>
                <button type="button" id="btn-confirm-reset-yes" class="btn-primary flex-1 py-2 text-xs" style="background:var(--danger);">Yes, Reset Everything</button>
              </div>
            </div>`);
          document.getElementById('btn-confirm-reset-cancel').addEventListener('click', openSettingsSheet);
          document.getElementById('btn-confirm-reset-yes').addEventListener('click', () => {
            state = createDefaultState();
            saveState(); applyTheme(); closeSheet(); renderMain(); updateBadges();
            showToast('Workspace reset to default', 'success');
          });
        });
      }

      // AGENT EDITOR SHEET
      function openAgentEditorSheet(agentId) {
        const isNew = !agentId;
        const a = isNew ? {
          id: uid('agent'),
          name: '',
          role: '',
          emoji: '🤖',
          provider: 'gemini',
          model: 'gemini-2.5-flash',
          temperature: 0.3,
          maxSteps: 10,
          memoryEnabled: true,
          wikiPermission: 'read-write',
          approvalGate: true,
          policy: 'balanced',
          systemPrompt: 'You are a custom Keryx agent. Orient via wiki/index.md, execute step by step, and verify before completing.',
          toolIds: ['tool_web_search', 'tool_wiki_rw'],
          skillIds: ['skill_deep_research'],
          mcpIds: [],
          connectorIds: []
        } : JSON.parse(JSON.stringify(getAgent(agentId)));

        const providerOptions = Object.entries(PROVIDERS).map(([k, v]) => `<option value="${k}" ${a.provider === k ? 'selected' : ''}>${v.name}</option>`).join('');
        const modelList = getProviderModels(a.provider);

        const html = `
          <div class="space-y-3">
            <div class="grid grid-cols-4 gap-2">
              <div>
                <label class="text-[11px] font-semibold block mb-1">Icon</label>
                <input id="ag-emoji" class="input-field text-center" value="${escapeHtml(a.emoji)}" />
              </div>
              <div class="col-span-3">
                <label class="text-[11px] font-semibold block mb-1">Agent Name</label>
                <input id="ag-name" class="input-field" value="${escapeHtml(a.name)}" placeholder="e.g., Market Analyst" />
              </div>
            </div>
            <div>
              <label class="text-[11px] font-semibold block mb-1">Role / Specialty</label>
              <input id="ag-role" class="input-field" value="${escapeHtml(a.role)}" placeholder="e.g., Daily news & wiki synthesizer" />
            </div>
            <div class="space-y-2">
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="text-[11px] font-semibold block mb-1">Provider</label>
                  <select id="ag-provider" class="input-field">${providerOptions}</select>
                </div>
                <div>
                  <label class="text-[11px] font-semibold block mb-1">Model ID</label>
                  <div class="flex gap-1">
                    <input id="ag-model" list="ag-model-list" class="input-field font-mono-code text-xs" value="${escapeHtml(a.model)}" placeholder="vendor/model-id" />
                    <button type="button" id="btn-save-ag-model-id" class="btn-ghost px-2 text-[11px] shrink-0" title="Save this Model ID to provider list">+ Save</button>
                  </div>
                  <datalist id="ag-model-list">${modelList.map(m => `<option value="${escapeHtml(m)}">`).join('')}</datalist>
                </div>
              </div>
              <div id="ag-model-chips" class="flex flex-wrap gap-1">
                ${modelList.map(m => `<button type="button" data-pick-model-id="${escapeHtml(m)}" class="pill ${a.model === m ? 'pill-accent' : 'pill-muted'} font-mono-code text-[10px] cursor-pointer">${escapeHtml(m)}</button>`).join('')}
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="text-[11px] font-semibold block mb-1">Temp</label>
                <input id="ag-temp" type="number" step="0.1" min="0" max="1.5" class="input-field" value="${a.temperature}" />
              </div>
              <div>
                <label class="text-[11px] font-semibold block mb-1">Max Steps</label>
                <input id="ag-steps" type="number" min="2" max="40" class="input-field" value="${a.maxSteps}" />
              </div>
              <div>
                <label class="text-[11px] font-semibold block mb-1">LLM Wiki</label>
                <select id="ag-wiki" class="input-field">
                  <option value="read-write" ${a.wikiPermission === 'read-write' ? 'selected' : ''}>Read/Write</option>
                  <option value="read-only" ${a.wikiPermission === 'read-only' ? 'selected' : ''}>Read Only</option>
                  <option value="none" ${a.wikiPermission === 'none' ? 'selected' : ''}>Disabled</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <label class="surface-subtle p-2.5 flex items-center justify-between text-xs cursor-pointer">
                <span>Persistent Memory</span>
                <input id="ag-memory" type="checkbox" ${a.memoryEnabled ? 'checked' : ''} />
              </label>
              <label class="surface-subtle p-2.5 flex items-center justify-between text-xs cursor-pointer">
                <span>Approval Gate</span>
                <input id="ag-gate" type="checkbox" ${a.approvalGate ? 'checked' : ''} />
              </label>
            </div>

            <div>
              <label class="text-[11px] font-semibold block mb-1">System Prompt</label>
              <textarea id="ag-prompt" rows="3" class="input-field text-xs">${escapeHtml(a.systemPrompt)}</textarea>
            </div>

            <div>
              <label class="text-[11px] font-semibold block mb-1.5">Assigned Tools</label>
              <div class="flex flex-wrap gap-1.5">
                ${state.tools.map(t => `<label class="pill pill-muted cursor-pointer"><input type="checkbox" data-ag-tool="${t.id}" ${a.toolIds.includes(t.id) ? 'checked' : ''} /> ${escapeHtml(t.name)}</label>`).join('')}
              </div>
            </div>

            <div>
              <label class="text-[11px] font-semibold block mb-1.5">Assigned Skills (SKILL.md)</label>
              <div class="flex flex-wrap gap-1.5">
                ${state.skills.map(s => `<label class="pill pill-muted cursor-pointer"><input type="checkbox" data-ag-skill="${s.id}" ${a.skillIds.includes(s.id) ? 'checked' : ''} /> ${escapeHtml(s.name)}</label>`).join('')}
              </div>
            </div>

            <div>
              <label class="text-[11px] font-semibold block mb-1.5">MCP Servers &amp; Connectors</label>
              <div class="flex flex-wrap gap-1.5">
                ${state.mcps.map(m => `<label class="pill pill-muted cursor-pointer"><input type="checkbox" data-ag-mcp="${m.id}" ${a.mcpIds.includes(m.id) ? 'checked' : ''} /> MCP: ${escapeHtml(m.name)}</label>`).join('')}
                ${state.connectors.map(c => `<label class="pill pill-muted cursor-pointer"><input type="checkbox" data-ag-conn="${c.id}" ${a.connectorIds.includes(c.id) ? 'checked' : ''} /> ${escapeHtml(c.name)}</label>`).join('')}
              </div>
            </div>

            <div class="flex items-center justify-between gap-2 pt-2">
              ${!isNew && state.agents.length > 1 ? `<button id="btn-del-agent" class="btn-ghost px-3 py-2 text-xs" style="color:var(--danger);">Delete</button>` : '<div></div>'}

            </div>
          </div>`;

        openSheet(isNew ? 'New Custom Agent' : `Configure ${a.name}`, 'Model, harness boundaries, tools, skills & connectors', html);

        function refreshAgentModelPicker(provKey, selectedModel) {
          const list = getProviderModels(provKey);
          document.getElementById('ag-model-list').innerHTML = list.map(m => `<option value="${escapeHtml(m)}">`).join('');
          const chipsEl = document.getElementById('ag-model-chips');
          if (chipsEl) {
            chipsEl.innerHTML = list.map(m => `<button type="button" data-pick-model-id="${escapeHtml(m)}" class="pill ${selectedModel === m ? 'pill-accent' : 'pill-muted'} font-mono-code text-[10px] cursor-pointer">${escapeHtml(m)}</button>`).join('');
            chipsEl.querySelectorAll('[data-pick-model-id]').forEach(btn => {
              btn.addEventListener('click', () => {
                document.getElementById('ag-model').value = btn.dataset.pickModelId;
                refreshAgentModelPicker(document.getElementById('ag-provider').value, btn.dataset.pickModelId);
              });
            });
          }
        }

        document.getElementById('ag-provider').addEventListener('change', e => {
          const list = getProviderModels(e.target.value);
          const nextModel = list[0] || '';
          document.getElementById('ag-model').value = nextModel;
          refreshAgentModelPicker(e.target.value, nextModel);
        });

        document.getElementById('btn-save-ag-model-id').addEventListener('click', () => {
          const prov = document.getElementById('ag-provider').value;
          const mid = document.getElementById('ag-model').value.trim();
          if (!mid) { showToast('Enter a Model ID first', 'warn'); return; }
          const added = addCustomModelId(prov, mid);
          refreshAgentModelPicker(prov, mid);
          showToast(added ? `Saved Model ID: ${mid}` : 'Model ID already saved', added ? 'success' : 'warn');
        });

        document.getElementById('btn-save-agent').addEventListener('click', () => {
          const name = document.getElementById('ag-name').value.trim();
          if (!name) { showToast('Enter an agent name', 'danger'); return; }
          a.emoji = document.getElementById('ag-emoji').value.trim() || '🤖';
          a.name = name;
          a.role = document.getElementById('ag-role').value.trim() || 'Custom Agent';
          a.provider = document.getElementById('ag-provider').value;
          a.model = document.getElementById('ag-model').value.trim() || 'gemini-2.5-flash';
          a.temperature = parseFloat(document.getElementById('ag-temp').value) || 0.3;
          a.maxSteps = parseInt(document.getElementById('ag-steps').value, 10) || 10;
          a.wikiPermission = document.getElementById('ag-wiki').value;
          a.memoryEnabled = document.getElementById('ag-memory').checked;
          a.approvalGate = document.getElementById('ag-gate').checked;
          a.systemPrompt = document.getElementById('ag-prompt').value.trim();
          a.toolIds = [...document.querySelectorAll('[data-ag-tool]:checked')].map(el => el.dataset.agTool);
          a.skillIds = [...document.querySelectorAll('[data-ag-skill]:checked')].map(el => el.dataset.agSkill);
          a.mcpIds = [...document.querySelectorAll('[data-ag-mcp]:checked')].map(el => el.dataset.agMcp);
          a.connectorIds = [...document.querySelectorAll('[data-ag-conn]:checked')].map(el => el.dataset.agConn);

          if (isNew) {
            state.agents.push(a);
            state.chats[a.id] = [{ id: uid('msg'), role: 'assistant', time: nowTime(), text: `**${a.name}** initialized and ready under the Keryx harness.`, trace: [] }];
          } else {
            const idx = state.agents.findIndex(x => x.id === a.id);
            if (idx >= 0) state.agents[idx] = a;
          }
          saveState(); closeSheet(); renderMain();
          showToast(isNew ? `Created ${a.name}` : `Updated ${a.name}`, 'success');
        });

        const delBtn = document.getElementById('btn-del-agent');
        if (delBtn) {
          delBtn.addEventListener('click', () => {
            state.agents = state.agents.filter(x => x.id !== a.id);
            if (state.ui.activeAgentId === a.id) state.ui.activeAgentId = state.agents[0].id;
            saveState(); closeSheet(); renderMain();
            showToast('Agent deleted');
          });
        }
      }

      // NEW BACKGROUND TASK SHEET
      function openNewTaskSheet(defaultAgentId) {
        const opts = state.agents.map(a => `<option value="${a.id}" ${a.id === defaultAgentId ? 'selected' : ''}>${a.emoji} ${escapeHtml(a.name)}</option>`).join('');
        const html = `<div class="space-y-3">

            <textarea id="nt-title" rows="2" class="input-field" placeholder="e.g., Research latest MCP spec updates and save to Wiki"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-semibold block mb-1">Assign Agent</label>
              <select id="nt-agent" class="input-field">${opts}</select>

      // OBSIDIAN MOBILE VAULT HELPERS & SHEET
      function buildObsidianMarkdown(page) {
        const hasFm = page.content.trim().startsWith('---');
        if (hasFm) return page.content;
        return `---\ntitle: "${page.title.replace(/"/g, "'")}"\ncategory: ${page.category}\nupdated: "${page.updatedAt}"\nsource: keryx-llm-wiki\n---\n\n${page.content}`;
      }

      function buildObsidianUri(mode, page) {
        const vault = encodeURIComponent(state.obsidian.vaultName || 'My Mobile Vault');
        const folder = (state.obsidian.folderPath || '').replace(/^\/+|\/+$/g, '');
        if (mode === 'vault') return `obsidian://open?vault=${vault}`;
        const filePath = (folder ? folder + '/' : '') + (page.title || page.slug);
        if (mode === 'open') return `obsidian://open?vault=${vault}&file=${encodeURIComponent(filePath)}`;
        const md = buildObsidianMarkdown(page);
        return `obsidian://new?vault=${vault}&file=${encodeURIComponent(filePath)}&content=${encodeURIComponent(md)}&overwrite=true`;
      }

      async function downloadMarkdownFile(filename, content) {
        const fsPlugin = capPlugin('Filesystem');
        if (fsPlugin && isNativeCap()) {
          try {
            const folder = (state.obsidian.folderPath || 'Keryx-Wiki').replace(/^\/+|\/+$/g, '');
            const relPath = (folder ? folder + '/' : '') + filename;
            await fsPlugin.writeFile({
              path: relPath,
              data: content,
              directory: 'DOCUMENTS',
              encoding: 'utf8',
              recursive: true
            });
            showToast(`Saved to Documents/${relPath}`, 'success');
            return;
          } catch (e) {}
        }
        try {
          const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast(`Downloaded ${filename}`, 'success');
        } catch (e) {
          copyText(content, filename);
        }
      }

      async function importObsidianFiles(fileList) {
        const files = Array.from(fileList || []).filter(f => /\.(md|markdown|txt)$/i.test(f.name));
        if (!files.length) {
          showToast('Select one or more .md files from your Obsidian vault', 'warn');
          return;
        }
        let added = 0;
        let updated = 0;
        for (const file of files) {
          const text = await file.text();
          const baseName = file.name.replace(/\.(md|markdown|txt)$/i, '');
          const slug = baseName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || uid('obs');
          let category = 'sources';
          const catMatch = text.match(/^category:\s*([a-zA-Z0-9_-]+)/m);
          if (catMatch && ['index', 'concepts', 'entities', 'sources', 'logs'].includes(catMatch[1].toLowerCase())) {
            category = catMatch[1].toLowerCase();
          }
          const existing = state.wiki.find(w => w.slug === slug || w.title.toLowerCase() === baseName.toLowerCase());
          if (existing) {
            existing.content = text;
            existing.updatedAt = 'Today, ' + nowTime();
            existing.source = 'obsidian';
            updated += 1;
          } else {
            state.wiki.push({
              id: uid('wiki'),
              slug,
              title: baseName,
              category,
              source: 'obsidian',
              updatedAt: 'Today, ' + nowTime(),
              content: text
            });
            added += 1;
          }
        }
        state.obsidian.connected = true;
        state.obsidian.lastSync = 'Today, ' + nowTime();
        state.obsidian.importedCount = (state.obsidian.importedCount || 0) + added + updated;

        const logPage = state.wiki.find(w => w.id === 'wiki_log' || w.slug === 'wiki-log');
        if (logPage) {
          logPage.content += `\n- **${nowTime()}** — Imported ${added} new, ${updated} updated notes from Obsidian vault **${state.obsidian.vaultName}**.`;
          logPage.updatedAt = 'Today, ' + nowTime();
        }
        saveState();
        renderMain();
        openObsidianVaultSheet();
        showToast(`Imported ${added + updated} Obsidian note${added + updated === 1 ? '' : 's'}`, 'success');
      }

                <input id="et-url" class="input-field col-span-2 font-mono-code text-xs" value="${escapeHtml(t.endpoint)}" />
              </div>
              <label class="surface-subtle p-2.5 flex items-center justify-between text-xs cursor-pointer">
                <span>Destructive / External Send (Approval Gated)</span>
                <input id="et-dest" type="checkbox" ${t.destructive ? 'checked' : ''} />
              </label>
              <button id="btn-save-edit-hub" class="btn-primary w-full py-2 text-xs">Save Tool</button>
            </div>`);
          document.getElementById('btn-save-edit-hub').addEventListener('click', () => {
            t.description = document.getElementById('et-desc').value.trim() || t.description;
            t.method = document.getElementById('et-method').value;
            t.endpoint = document.getElementById('et-url').value.trim() || t.endpoint;
            t.destructive = document.getElementById('et-dest').checked;
            saveState(); closeSheet(); renderMain(); showToast(`Updated ${t.name}`, 'success');
          });
        } else if (kind === 'skill') {
          const s = state.skills.find(x => x.id === id);
          if (!s) return;
          openSheet(`Edit SKILL.md: ${s.name}`, 'Modify skill instructions loaded into agent prompts', `
            <div class="space-y-3">
              <input id="es-desc" class="input-field text-xs" value="${escapeHtml(s.description)}" />
              <textarea id="es-body" rows="8" class="input-field font-mono-code text-xs">${escapeHtml(s.content)}</textarea>
              <button id="btn-save-edit-hub" class="btn-primary w-full py-2 text-xs">Save SKILL.md</button>
            </div>`);
          document.getElementById('btn-save-edit-hub').addEventListener('click', () => {
            s.description = document.getElementById('es-desc').value.trim() || s.description;
            s.content = document.getElementById('es-body').value;
            saveState(); closeSheet(); renderMain(); showToast(`Saved ${s.name}`, 'success');
          });
        } else if (kind === 'mcp') {
          const m = state.mcps.find(x => x.id === id);
          if (!m) return;
          openSheet(`Configure MCP: ${m.name}`, 'Streamable HTTP JSON-RPC 2.0 endpoint & tool discovery', `
            <div class="space-y-3">
              <input id="em-url" class="input-field font-mono-code text-xs" value="${escapeHtml(m.url)}" placeholder="https://mcp.example.com/mcp" />
              <input id="em-token" type="password" class="input-field font-mono-code text-xs" value="${escapeHtml(m.authToken || '')}" placeholder="Optional Bearer Token" />
              <input id="em-tools" class="input-field font-mono-code text-xs" value="${escapeHtml((m.tools || []).join(', '))}" placeholder="Comma-separated tool names" />
              <div class="flex gap-2">
                <button type="button" id="btn-test-mcp" class="btn-ghost flex-1 py-2 text-xs">Discover Tools</button>
                <button type="button" id="btn-save-edit-hub" class="btn-primary flex-1 py-2 text-xs">Save MCP</button>
              </div>
            </div>`);
          document.getElementById('btn-save-edit-hub').addEventListener('click', () => {
            m.url = document.getElementById('em-url').value.trim() || m.url;
            m.authToken = document.getElementById('em-token').value.trim();
            m.tools = document.getElementById('em-tools').value.split(',').map(x => x.trim()).filter(Boolean);
            saveState(); closeSheet(); renderMain(); showToast(`Saved ${m.name}`, 'success');
          });
          document.getElementById('btn-test-mcp').addEventListener('click', async () => {
            m.url = document.getElementById('em-url').value.trim() || m.url;
            m.authToken = document.getElementById('em-token').value.trim();
            try {
              const tools = await window.KeryxEngine.connectMcpServer(m);
              saveState(); openHubEditSheet('mcp', m.id); renderMain();
              showToast(`Discovered ${tools.length} tools from ${m.name}`, 'success');
            } catch (err) {
              showToast(`MCP failed: ${err.message}`, 'danger');
            }
          });
        } else if (kind === 'connector') {
          const c = state.connectors.find(x => x.id === id);
          if (!c) return;
          const isTg = c.name.toLowerCase().includes('telegram');
          openSheet(`Configure ${c.name}`, 'Real outbound delivery credentials & Approval Gate', `
            <div class="space-y-3">
              ${isTg ? `
                <div>
                  <label class="text-[11px] font-semibold block mb-1">Telegram Bot Token</label>
                  <input id="ec-token" type="password" class="input-field font-mono-code text-xs" value="${escapeHtml(c.botToken || '')}" placeholder="123456:ABC-DEF..." />
                </div>
                <div>
                  <label class="text-[11px] font-semibold block mb-1">Target Chat ID</label>
                  <input id="ec-chatid" class="input-field font-mono-code text-xs" value="${escapeHtml(c.chatId || '')}" placeholder="e.g., 987654321 or @channel" />
                </div>
              ` : `
                <div>
                  <label class="text-[11px] font-semibold block mb-1">Webhook HTTPS URL</label>
                  <input id="ec-webhook" type="url" class="input-field font-mono-code text-xs" value="${escapeHtml(c.webhookUrl || '')}" placeholder="https://hooks.slack.com/services/... or https://discord.com/api/webhooks/..." />
                </div>
                <div>
                  <label class="text-[11px] font-semibold block mb-1">Optional Authorization Header</label>
                  <input id="ec-auth" type="password" class="input-field font-mono-code text-xs" value="${escapeHtml(c.authHeader || '')}" placeholder="Bearer ..." />
                </div>
              `}
              <label class="surface-subtle p-2.5 flex items-center justify-between text-xs cursor-pointer">
                <span>Require Approval Gate before sending</span>
                <input id="ec-gate" type="checkbox" ${c.requiresApproval ? 'checked' : ''} />
              </label>
              <div class="flex gap-2">
                <button type="button" id="btn-test-conn" class="btn-ghost flex-1 py-2 text-xs">Test Send</button>
                <button type="button" id="btn-save-edit-hub" class="btn-primary flex-1 py-2 text-xs">Save Connector</button>
              </div>
            </div>`);
          const readFields = () => {
            if (isTg) {
              c.botToken = document.getElementById('ec-token').value.trim();
              c.chatId = document.getElementById('ec-chatid').value.trim();
              if (c.chatId) c.handle = c.chatId;
            } else {
              c.webhookUrl = document.getElementById('ec-webhook').value.trim();
              c.authHeader = document.getElementById('ec-auth').value.trim();
              if (c.webhookUrl) c.handle = c.webhookUrl;
            }
            c.requiresApproval = document.getElementById('ec-gate').checked;
          };
          document.getElementById('btn-save-edit-hub').addEventListener('click', () => {
            readFields();
            saveState(); closeSheet(); renderMain(); showToast(`Saved ${c.name}`, 'success');
          });
          document.getElementById('btn-test-conn').addEventListener('click', async () => {
            readFields();
            saveState();
            try {
              const res = await window.KeryxEngine.dispatchConnector(c, 'Test ping from Keryx Mobile Platform ✅', 'Keryx Connector Test');
              showToast(res.detail, 'success');
            } catch (err) {
              showToast(err.message, 'danger');
            }
          });
        }
      }

      // ============================
      // VIEW EVENT LISTENERS
      // ============================
      function attachViewListeners() {
        // Wikilinks, external markdown links, and code copy buttons anywhere
        document.querySelectorAll('[data-wikilink]').forEach(btn => {
          btn.addEventListener('click', () => {
            const targetTitle = btn.dataset.wikilink.toLowerCase();
            let page = state.wiki.find(p => p.title.toLowerCase() === targetTitle || p.slug === targetTitle.replace(/\s+/g, '-'));
            if (!page) {
              page = {
                id: uid('wiki'),
                slug: targetTitle.replace(/[^a-z0-9]+/g, '-'),
                title: btn.dataset.wikilink,
                category: 'concepts',
                updatedAt: 'Today, ' + nowTime(),
                content: `# ${btn.dataset.wikilink}\n\nNew stub created from wikilink. Linked back to [[Wiki Index]].`
              };
              state.wiki.push(page);
              saveState();
              showToast(`Created wiki page [[${page.title}]]`);
            }
            state.ui.wikiViewMode = 'wiki';
            state.ui.activeWikiId = page.id;
            state.ui.tab = 'wiki';
            state.ui.wikiEditMode = false;
            saveState();
            renderMain();
          });
        });
        document.querySelectorAll('[data-ext-url]').forEach(btn => {
          btn.addEventListener('click', () => openExternalUrl(btn.dataset.extUrl));
        });
        document.querySelectorAll('[data-copy-code]').forEach(btn => {
          btn.addEventListener('click', () => copyText(btn.dataset.copyCode, 'Code'));
        });

        // Chat listeners
        document.querySelectorAll('[data-select-chat-agent]').forEach(b => b.addEventListener('click', () => {
          state.ui.activeAgentId = b.dataset.selectChatAgent;
          saveState(); renderMain();
        }));
        const qna = document.getElementById('btn-quick-new-agent');
        if (qna) qna.addEventListener('click', () => openAgentEditorSheet(null));

        const simAddBtn = document.getElementById('btn-sim-add-key');
        if (simAddBtn) {
          simAddBtn.addEventListener('click', () => openSettingsSheet(simAddBtn.dataset.focusProvider));
        }
        document.querySelectorAll('[data-fix-provider]').forEach(b => {
          b.addEventListener('click', () => openSettingsSheet(b.dataset.fixProvider));
        });
        document.querySelectorAll('[data-copy-reply]').forEach(b => {
          b.addEventListener('click', () => {
            const agent = getAgent(state.ui.activeAgentId);
            const m = (state.chats[agent.id] || []).find(x => x.id === b.dataset.copyReply);
            if (m) copyText(m.text, 'Reply');
          });
        });
        document.querySelectorAll('[data-save-skill]').forEach(b => {
          b.addEventListener('click', () => {
            const agent = getAgent(state.ui.activeAgentId);
            const m = (state.chats[agent.id] || []).find(x => x.id === b.dataset.saveSkill);
            if (!m) return;
            const slug = 'learned-' + uid('sk').slice(3);
            state.skills.unshift({
              id: uid('skill'),
              name: slug,
              description: `Distilled from ${agent.name} reply`,
              enabled: true,
              content: `---\nname: ${slug}\ndescription: Learned workflow from ${agent.name}\n---\n${m.text.slice(0, 1200)}`
            });
            saveState();
            showToast(`Saved ${slug} to Skills`, 'success');
          });
        });

        const sendBtn = document.getElementById('btn-chat-send');
        const bgBtn = document.getElementById('btn-chat-bg');
        const flowBtn = document.getElementById('btn-chat-flow');
        const clearBtn = document.getElementById('btn-chat-clear');
        const chatInput = document.getElementById('chat-input');

        function renderWorkingCard(agentName, activeIdx, activeDetail, streamPreview) {
          const steps = [
            { label: 'Orient', fallback: 'Read AGENTS.md & [[Wiki Index]]' },
            { label: 'Skills', fallback: 'Load skills & tools' },
            { label: 'Execute', fallback: 'Generate agent response' },
            { label: 'Verify Gate', fallback: 'Run schema_verify & harness-critic' }
          ];
          const rows = steps.map((st, idx) => {
            const done = idx < activeIdx;
            const active = idx === activeIdx;
            const iconHtml = done
              ? `<span class="w-4 h-4 rounded-full inline-flex items-center justify-center text-[10px] font-bold shrink-0" style="background:var(--success-soft); color:var(--success);">✓</span>`
              : active
              ? `<progress aria-label="${escapeHtml(st.label)}" class="loading-spinner loading-spinner-sm"></progress>`
              : `<span class="w-4 h-4 inline-flex items-center justify-center text-[10px] shrink-0" style="color:var(--muted);">○</span>`;
            const detailText = active && activeDetail ? activeDetail : st.fallback;
            return `<div class="flex items-center gap-2 text-[11.5px] ${done ? 'opacity-80' : ''}">
              ${iconHtml}
              <span class="font-semibold shrink-0" style="color:${done ? 'var(--success)' : active ? 'var(--text)' : 'var(--muted)'};">${st.label}</span>
              <span class="truncate" style="color:var(--muted);">${escapeHtml(detailText)}</span>
            </div>`;
          }).join('');
          const previewHtml = streamPreview
            ? `<div class="p-2.5 rounded-xl text-xs prose-sm border" style="background:var(--bg); border-color:var(--border);">${renderMarkdownWithWikiLinks(streamPreview)}</div>`
            : '';
          return `<div class="max-w-[92%] surface card-pad space-y-2.5" style="border-color: var(--accent);">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <progress aria-label="Agent is working" class="loading-spinner"></progress>
                <div class="min-w-0">
                  <div class="text-xs font-semibold">Agent is working…</div>
                  <div class="text-[11px] truncate" style="color:var(--muted);">${escapeHtml(agentName)} · Orient → Skills → Execute → Verify Gate</div>
                </div>
              </div>
              <span class="pill pill-accent text-[10px] shrink-0">Running</span>
            </div>
            <div class="surface-subtle p-2.5 space-y-1.5">${rows}</div>
            ${previewHtml}
          </div>`;
        }

        if (sendBtn && chatInput) {
          let isSending = false;
          const handleSend = async () => {
            if (isSending) return;
            const text = chatInput.value.trim();
            if (!text) return;
            isSending = true;
            const agent = getAgent(state.ui.activeAgentId);
            if (!state.chats[agent.id]) state.chats[agent.id] = [];
            state.chats[agent.id].push({ id: uid('msg'), role: 'user', time: nowTime(), text });
            chatInput.value = '';
            saveState(); renderMain();

            const liveSendBtn = document.getElementById('btn-chat-send');
            if (liveSendBtn) {
              liveSendBtn.disabled = true;
              liveSendBtn.style.opacity = '0.6';
              liveSendBtn.innerHTML = `<progress aria-label="Sending" class="loading-spinner loading-spinner-sm"></progress><span>Working…</span>`;
            }

            const listEl = document.getElementById('chat-messages-list');
            let workingCard = null;
            let lastStepIdx = 0;
            let lastDetail = 'Reading AGENTS.md & Wiki Index';
            if (listEl) {
              workingCard = document.createElement('div');
              workingCard.id = 'chat-working-card';
              workingCard.className = 'flex justify-start';
              workingCard.innerHTML = renderWorkingCard(agent.name, 0, lastDetail, '');
              listEl.appendChild(workingCard);
              scrollChatToBottom(true);
            }

            try {
              const resp = await runAgentChatTurn(
                agent,
                text,
                (stepIdx, detail) => {
                  lastStepIdx = stepIdx;
                  lastDetail = detail;
                  if (workingCard) {
                    workingCard.innerHTML = renderWorkingCard(agent.name, stepIdx, detail, '');
                    scrollChatToBottom(true);
                  }
                },
                (streamedText) => {
                  if (workingCard) {
                    workingCard.innerHTML = renderWorkingCard(agent.name, lastStepIdx, lastDetail, streamedText);
                    scrollChatToBottom(true);
                  }
                }
              );
              if (workingCard) {
                workingCard.innerHTML = renderWorkingCard(agent.name, 4, '', '');
                await new Promise(r => setTimeout(r, 200));
              }
              state.chats[agent.id].push({
                id: uid('msg'),
                role: 'assistant',
                time: nowTime(),
                text: resp.text,
                trace: resp.trace || [],
                error: resp.error || null,
                pendingApproval: resp.pendingApproval || null
              });
              saveState(); renderMain();
              scrollChatToBottom(false);
            } finally {
              isSending = false;
            }
          };
          sendBtn.addEventListener('click', handleSend);
          chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
          });
        }
        if (bgBtn && chatInput) {
          bgBtn.addEventListener('click', () => {
            const text = chatInput.value.trim() || 'Background synthesis & LLM Wiki update';
            const agent = getAgent(state.ui.activeAgentId);
            const isExt = /telegram|slack|discord|whatsapp|send|notify|webhook/i.test(text);
            enqueueBackgroundTask({
              title: text,
              agentId: agent.id,
              schedule: 'One-off',
              requiresExternalSend: isExt,
              wikiWriteTitle: /wiki|research|brief|ingest/i.test(text) ? text.slice(0, 32) : null
            });
            chatInput.value = '';
            state.ui.tab = 'tasks';
            saveState(); renderMain();
          });
        }
        if (flowBtn && chatInput) {
          flowBtn.addEventListener('click', () => openFlowRunnerSheet(chatInput.value.trim()));
        }
        if (clearBtn) {
          clearBtn.addEventListener('click', () => {
            openSheet('Clear Chat Thread', 'Remove messages in this conversation', `
              <div class="space-y-3">
                <p class="text-xs" style="color:var(--muted);">Clear all messages for the active agent thread?</p>
                <div class="flex gap-2">
                  <button type="button" id="btn-cancel-clear" class="btn-ghost flex-1 py-2 text-xs">Cancel</button>
                  <button type="button" id="btn-confirm-clear" class="btn-primary flex-1 py-2 text-xs" style="background:var(--danger);">Clear Thread</button>
                </div>
              </div>`);
            document.getElementById('btn-cancel-clear').addEventListener('click', closeSheet);
            document.getElementById('btn-confirm-clear').addEventListener('click', () => {
              const agent = getAgent(state.ui.activeAgentId);
              state.chats[agent.id] = [{ id: uid('msg'), role: 'assistant', time: nowTime(), text: `Thread cleared. **${agent.name}** ready.`, trace: [] }];
              saveState(); closeSheet(); renderMain();
            });
          });
        }
        document.querySelectorAll('[data-chat-approve]').forEach(b => b.addEventListener('click', async () => {
          const agent = getAgent(state.ui.activeAgentId);
          const msg = (state.chats[agent.id] || []).find(m => m.id === b.dataset.chatApprove);
          if (!msg || !msg.pendingApproval) return;
          const appr = msg.pendingApproval;
          appr.status = 'approved';
          try {
            if (appr.kind === 'tool' && appr.toolName) {
              const def = window.KeryxEngine.buildToolDefinitions(agent, state).find(d => d.name === appr.toolName);
              if (def) {
                const res = await window.KeryxEngine.executeToolCall(def, appr.args || {}, { agent, state, bypassApproval: true, compileAgentsMdFn: compileAgentsMd });
                msg.trace.push({ step: 'Executed', detail: `${appr.toolName}: ${JSON.stringify(res).slice(0, 120)}`, status: 'ok' });
                showToast(`Executed ${appr.toolName}`, 'success');
              }
            } else {
              const conn = state.connectors.find(c => c.id === appr.connectorId) || state.connectors.find(c => c.enabled);
              if (conn) {
                const res = await window.KeryxEngine.dispatchConnector(conn, appr.message || appr.summary, appr.title || agent.name);
                msg.trace.push({ step: 'Connector', detail: res.detail, status: 'ok' });
                showToast(res.detail, 'success');
              }
            }
          } catch (err) {
            msg.trace.push({ step: 'Connector', detail: err.message, status: 'danger' });
            showToast(err.message, 'danger');
          }
          saveState(); renderMain();
        }));
        document.querySelectorAll('[data-chat-reject]').forEach(b => b.addEventListener('click', () => {
          const agent = getAgent(state.ui.activeAgentId);
          const msg = (state.chats[agent.id] || []).find(m => m.id === b.dataset.chatReject);
          if (msg && msg.pendingApproval) {
            msg.pendingApproval.status = 'rejected';
            msg.trace.push({ step: 'Connector', detail: 'Rejected by user — halted cleanly.', status: 'warn' });
            saveState(); renderMain(); showToast('Action rejected');
          }
        }));

        // Tasks listeners
        const btnNewTask = document.getElementById('btn-new-task');
        if (btnNewTask) btnNewTask.addEventListener('click', () => openNewTaskSheet(state.ui.activeAgentId));
        const btnNewCron = document.getElementById('btn-new-cron');
        if (btnNewCron) btnNewCron.addEventListener('click', () => openCronEditorSheet(null));
        document.querySelectorAll('[data-edit-cron]').forEach(b => b.addEventListener('click', () => openCronEditorSheet(b.dataset.editCron)));

        const tGate = document.getElementById('tasks-approval-toggle');
        if (tGate) tGate.addEventListener('click', () => {
          state.harness.globalApprovalGate = !state.harness.globalApprovalGate;
          saveState(); applyTheme(); renderMain();
          showToast('Global Approval Gate ' + (state.harness.globalApprovalGate ? 'ON' : 'OFF'));
        });

        document.querySelectorAll('[data-task-filter]').forEach(b => b.addEventListener('click', () => {
          state.ui.taskFilter = b.dataset.taskFilter; saveState(); renderMain();
        }));
        document.querySelectorAll('[data-task-approve]').forEach(b => b.addEventListener('click', () => {
          const t = state.tasks.find(x => x.id === b.dataset.taskApprove);
          if (t) {
            t._approvedOnce = true;
            t.status = 'running';
            const w = t.todos.find(td => td.status === 'waiting');
            if (w) w.status = 'active';
            t.logs.push({ time: nowTime(), type: 'gate', text: 'APPROVED by user — executing & resuming.' });
            saveState(); updateBadges(); renderMain();
            runBackgroundTaskAsync(t);
            showToast('Approved — task resumed', 'success');
          }
        }));
        document.querySelectorAll('[data-task-reject]').forEach(b => b.addEventListener('click', () => {
          const t = state.tasks.find(x => x.id === b.dataset.taskReject);
          if (t) {
            t.status = 'rejected';
            t.pendingAction = null;
            t.logs.push({ time: nowTime(), type: 'gate', text: 'REJECTED by user — stopped safely.' });
            saveState(); updateBadges(); renderMain(); showToast('Task halted safely');
          }
        }));
        document.querySelectorAll('[data-task-pause]').forEach(b => b.addEventListener('click', () => {
          const t = state.tasks.find(x => x.id === b.dataset.taskPause);
          if (t) { t.status = 'paused'; saveState(); updateBadges(); renderMain(); }
        }));
        document.querySelectorAll('[data-task-resume]').forEach(b => b.addEventListener('click', () => {
          const t = state.tasks.find(x => x.id === b.dataset.taskResume);
          if (t) { t.status = 'running'; saveState(); updateBadges(); renderMain(); runBackgroundTaskAsync(t); }
        }));
        document.querySelectorAll('[data-task-rerun]').forEach(b => b.addEventListener('click', () => {
          const t = state.tasks.find(x => x.id === b.dataset.taskRerun);
          if (t) {
            enqueueBackgroundTask({ title: t.title, agentId: t.agentId, schedule: t.schedule, requiresExternalSend: t.requiresExternalSend, wikiWriteTitle: t.wikiWriteTitle, wikiCategory: t.wikiCategory, rawSource: t.rawSource, flowAgentIds: t.flowAgentIds });
          }
        }));
        document.querySelectorAll('[data-task-delete]').forEach(b => b.addEventListener('click', () => {
          state.tasks = state.tasks.filter(x => x.id !== b.dataset.taskDelete);
          saveState(); updateBadges(); renderMain();
        }));
        document.querySelectorAll('[data-cron-toggle]').forEach(b => b.addEventListener('click', () => {
          const c = state.cronJobs.find(x => x.id === b.dataset.cronToggle);
          if (c) { c.enabled = !c.enabled; saveState(); renderMain(); showToast(`${c.name} ${c.enabled ? 'enabled' : 'paused'}`); }
        }));
        document.querySelectorAll('[data-cron-run]').forEach(b => b.addEventListener('click', () => {
          const c = state.cronJobs.find(x => x.id === b.dataset.cronRun);
          if (c) {
            c.lastRunTs = Date.now();
            c.lastRun = 'Today ' + nowTime();
            enqueueBackgroundTask({ title: `${c.name}: ${c.prompt || 'Scheduled run'}`, agentId: c.agentId, schedule: c.schedule, requiresExternalSend: c.agentId === 'agent_ops' });
          }
        }));

        // Agents listeners
        const btnCA = document.getElementById('btn-create-agent');
        if (btnCA) btnCA.addEventListener('click', () => openAgentEditorSheet(null));
        document.querySelectorAll('[data-edit-agent]').forEach(b => b.addEventListener('click', () => openAgentEditorSheet(b.dataset.editAgent)));
        document.querySelectorAll('[data-chat-with-agent]').forEach(b => b.addEventListener('click', () => {
          state.ui.activeAgentId = b.dataset.chatWithAgent;
          state.ui.tab = 'chat';
          saveState(); renderMain();
        }));
        document.querySelectorAll('[data-dispatch-agent]').forEach(b => b.addEventListener('click', () => openNewTaskSheet(b.dataset.dispatchAgent)));

        // Wiki & Memory listeners
        document.querySelectorAll('[data-wiki-view-mode]').forEach(b => b.addEventListener('click', () => {
          state.ui.wikiViewMode = b.dataset.wikiViewMode; saveState(); renderMain();
        }));
        const btnAddMem = document.getElementById('btn-add-memory');
        if (btnAddMem) {
          btnAddMem.addEventListener('click', () => {
            const key = document.getElementById('mem-new-key').value.trim();
            const value = document.getElementById('mem-new-val').value.trim();
            if (!key || !value) { showToast('Enter both key and value', 'warn'); return; }
            if (!Array.isArray(state.memory)) state.memory = [];
            state.memory.unshift({ id: uid('mem'), key, value, updatedAt: 'Today, ' + nowTime() });
            saveState(); renderMain(); showToast('Saved memory entry', 'success');
          });
        }
        document.querySelectorAll('[data-del-memory]').forEach(b => b.addEventListener('click', () => {
          state.memory = (state.memory || []).filter(m => m.id !== b.dataset.delMemory);
          saveState(); renderMain();
        }));

        const ws = document.getElementById('wiki-search-input');
        if (ws) ws.addEventListener('input', e => {
          const pos = e.target.selectionStart;
          state.ui.wikiSearch = e.target.value;
          renderMain();
          const nextInput = document.getElementById('wiki-search-input');
          if (nextInput) {
            nextInput.focus();
            if (typeof pos === 'number') nextInput.setSelectionRange(pos, pos);
          }
        });
        document.querySelectorAll('[data-wiki-cat]').forEach(b => b.addEventListener('click', () => {
          state.ui.wikiCategory = b.dataset.wikiCat; saveState(); renderMain();
        }));
        document.querySelectorAll('[data-wiki-select]').forEach(b => b.addEventListener('click', () => {
          state.ui.activeWikiId = b.dataset.wikiSelect; state.ui.wikiEditMode = false; saveState(); renderMain();
        }));
        const bte = document.getElementById('btn-wiki-toggle-edit');
        if (bte) bte.addEventListener('click', () => { state.ui.wikiEditMode = !state.ui.wikiEditMode; renderMain(); });
        const bws = document.getElementById('btn-wiki-save');
        if (bws) bws.addEventListener('click', () => {
          const page = state.wiki.find(p => p.id === state.ui.activeWikiId);
          const ta = document.getElementById('wiki-editor-ta');
          if (page && ta) {
            page.content = ta.value;
            page.updatedAt = 'Today, ' + nowTime();
            state.ui.wikiEditMode = false;
            saveState(); renderMain(); showToast('Wiki page saved', 'success');
          }
        });
        const bwi = document.getElementById('btn-wiki-ingest');
        if (bwi) bwi.addEventListener('click', openWikiIngestSheet);
        const bObs = document.getElementById('btn-open-obsidian');
        if (bObs) bObs.addEventListener('click', openObsidianVaultSheet);
        const bObsBar = document.getElementById('btn-obsidian-bar-open');
        if (bObsBar) bObsBar.addEventListener('click', openObsidianVaultSheet);
        const bPushObs = document.getElementById('btn-wiki-push-obsidian');
        if (bPushObs) bPushObs.addEventListener('click', async () => {
          const page = state.wiki.find(p => p.id === state.ui.activeWikiId);
          if (!page) return;
          if (state.obsidian.syncMode === 'read-only') {
            showToast('Vault is in Read-Only mode — change in Obsidian settings', 'warn');
            return;
          }
          const md = buildObsidianMarkdown(page);
          if (md.length > 1500 && isNativeCap()) {
            await downloadMarkdownFile((page.slug || 'note') + '.md', md);
            const openUri = buildObsidianUri('vault', page);
            try { window.open(openUri, '_blank'); } catch (e) {}
            return;
          }
          const uri = buildObsidianUri('new', page);
          try { window.open(uri, '_blank'); } catch (e) {}
          copyText(uri, 'Obsidian URI');
          showToast(`Opening "${page.title}" in Obsidian mobile`, 'success');
        });
        const bDlMd = document.getElementById('btn-wiki-download-md');
        if (bDlMd) bDlMd.addEventListener('click', () => {
          const page = state.wiki.find(p => p.id === state.ui.activeWikiId);
          if (!page) return;
          downloadMarkdownFile((page.slug || 'note') + '.md', buildObsidianMarkdown(page));
        });
        const bwl = document.getElementById('btn-wiki-lint');
        if (bwl) bwl.addEventListener('click', () => {
          const audit = window.KeryxEngine.runSchemaVerify(state, '');
          enqueueBackgroundTask({
            title: `LLM Wiki Lint (${audit.wikiCount} pages, ${audit.brokenLinks.length} unresolved links)`,
            agentId: 'agent_librarian',
            schedule: 'One-off',
            requiresExternalSend: false
          });
          state.ui.tab = 'tasks'; saveState(); renderMain();
        });

        // Hub listeners
        document.querySelectorAll('[data-hub-sub]').forEach(b => b.addEventListener('click', () => {
          state.ui.hubSubTab = b.dataset.hubSub; saveState(); renderMain();
        }));
        const btnSaveSearch = document.getElementById('btn-save-search-cfg');
        if (btnSaveSearch) btnSaveSearch.addEventListener('click', () => {
          state.search = {
            provider: document.getElementById('hub-search-provider').value,
            apiKey: document.getElementById('hub-search-key').value.trim(),
            endpoint: document.getElementById('hub-search-endpoint').value.trim()
          };
          saveState(); renderMain(); showToast('Search provider saved', 'success');
        });
        document.querySelectorAll('[data-tool-toggle]').forEach(b => b.addEventListener('click', () => {
          const t = state.tools.find(x => x.id === b.dataset.toolToggle);
          if (t) { t.enabled = !t.enabled; saveState(); renderMain(); }
        }));
        document.querySelectorAll('[data-skill-toggle]').forEach(b => b.addEventListener('click', () => {
          const s = state.skills.find(x => x.id === b.dataset.skillToggle);
          if (s) { s.enabled = !s.enabled; saveState(); renderMain(); }
        }));
        document.querySelectorAll('[data-mcp-toggle]').forEach(b => b.addEventListener('click', async () => {
          const m = state.mcps.find(x => x.id === b.dataset.mcpToggle);
          if (!m) return;
          if (m.status === 'connected') {
            m.status = 'standby';
            saveState(); renderMain(); showToast(`${m.name}: standby`);
          } else {
            try {
              const tools = await window.KeryxEngine.connectMcpServer(m);
              saveState(); renderMain(); showToast(`Connected ${m.name} (${tools.length} tools)`, 'success');
            } catch (err) {
              m.status = 'connected';
              saveState(); renderMain();
              showToast(`${m.name}: local/cached mode (${err.message})`, 'warn');
            }
          }
        }));
        document.querySelectorAll('[data-conn-toggle]').forEach(b => b.addEventListener('click', () => {
          const c = state.connectors.find(x => x.id === b.dataset.connToggle);
          if (c) { c.enabled = !c.enabled; saveState(); renderMain(); }
        }));
        document.querySelectorAll('[data-edit-tool]').forEach(b => b.addEventListener('click', () => openHubEditSheet('tool', b.dataset.editTool)));
        document.querySelectorAll('[data-edit-skill]').forEach(b => b.addEventListener('click', () => openHubEditSheet('skill', b.dataset.editSkill)));
        document.querySelectorAll('[data-edit-mcp]').forEach(b => b.addEventListener('click', () => openHubEditSheet('mcp', b.dataset.editMcp)));
        document.querySelectorAll('[data-edit-conn]').forEach(b => b.addEventListener('click', () => openHubEditSheet('connector', b.dataset.editConn)));
        const bAddT = document.getElementById('btn-add-tool'); if (bAddT) bAddT.addEventListener('click', () => openHubAddSheet('tool'));
        const bAddS = document.getElementById('btn-add-skill'); if (bAddS) bAddS.addEventListener('click', () => openHubAddSheet('skill'));
        const bAddM = document.getElementById('btn-add-mcp'); if (bAddM) bAddM.addEventListener('click', () => openHubAddSheet('mcp'));
        const bAddC = document.getElementById('btn-add-connector'); if (bAddC) bAddC.addEventListener('click', () => openHubAddSheet('connector'));
      }

      // Global shell listeners
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.ui.tab = btn.dataset.nav;
          saveState();
          renderMain();
        });
      });

      document.getElementById('btn-open-harness').addEventListener('click', openHarnessSheet);
      document.getElementById('btn-open-settings').addEventListener('click', () => openSettingsSheet());
      document.getElementById('btn-bg-pill').addEventListener('click', () => {
        state.ui.tab = 'tasks';
        saveState();
        renderMain();
      });
      document.getElementById('sidebar-approval-toggle').addEventListener('click', () => {
        state.harness.globalApprovalGate = !state.harness.globalApprovalGate;
        saveState(); applyTheme(); renderMain();
        showToast('Global Approval Gate ' + (state.harness.globalApprovalGate ? 'ON' : 'OFF'));
      });

      // Boot & Async IndexedDB Hydration
      applyTheme();
      updateBadges();
      renderMain();
      window.KeryxStorage.loadPersistedState().then(res => {
        if (res && res.state && res.source === 'indexeddb') {
          state = ensureStateDefaults(res.state);
          applyTheme();
          updateBadges();
          renderMain();
        }
      }).catch(() => {});
      if (bgInterval) clearInterval(bgInterval);
      bgInterval = setInterval(tickBackgroundTasks, 1600);

      // Android hardware back button handling via @capacitor/app
      const appPlugin = capPlugin('App');
      if (appPlugin && isNativeCap()) {
        appPlugin.addListener('backButton', () => {
          const dialog = document.getElementById('app-sheet-dialog');
          if (dialog && dialog.open) {
            dialog.close();
            return;
          }
          if (state.ui.tab !== 'chat') {
            state.ui.tab = 'chat';
            saveState();
            renderMain();
            return;
          }
          appPlugin.minimizeApp().catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
